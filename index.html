<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能招聘系统 · SmartRecruit Pro</title>
<style>
:root{
  --primary:#2563eb;--primary-d:#1d4ed8;--primary-bg:#eff6ff;
  --purple:#7c3aed;--purple-bg:#f5f3ff;
  --green:#16a34a;--green-bg:#f0fdf4;
  --orange:#ea580c;--orange-bg:#fff7ed;
  --red:#dc2626;--red-bg:#fef2f2;
  --gold:#d97706;--gold-bg:#fffbeb;
  --teal:#0d9488;--teal-bg:#f0fdfa;
  --bg:#f1f5f9;--card:#ffffff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;
  --sidebar:#0f1e3d;--sidebar-text:#94a3b8;
  --radius:12px;--shadow:0 1px 3px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
#app{display:flex;min-height:100vh}
/* ---------- 侧边栏 ---------- */
#sidebar{width:216px;background:var(--sidebar);color:var(--sidebar-text);flex-shrink:0;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:50}
.logo{display:flex;align-items:center;gap:10px;padding:20px 18px 16px;color:#fff}
.logo-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;font-weight:700}
.logo b{font-size:15.5px;letter-spacing:.5px}
.logo small{display:block;font-size:10px;color:#64748b;font-weight:400;margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:6px 10px}
.nav-group{font-size:10.5px;color:#475569;padding:14px 10px 6px;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9.5px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;transition:.15s;font-size:13.5px}
.nav-item:hover{background:rgba(255,255,255,.06);color:#e2e8f0}
.nav-item.active{background:var(--primary);color:#fff;font-weight:500}
.nav-item .ni{width:17px;text-align:center;opacity:.85}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;border-radius:99px;padding:1px 7px}
.sidebar-foot{padding:14px 18px;font-size:11px;color:#475569;border-top:1px solid rgba(255,255,255,.07)}
/* ---------- 主区 ---------- */
#main{flex:1;margin-left:216px;display:flex;flex-direction:column;min-width:0}
#topbar{background:var(--card);border-bottom:1px solid var(--border);padding:0 26px;height:58px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:40}
#topbar h1{font-size:16.5px;font-weight:600}
.crumb{font-size:12px;color:var(--muted)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.ai-chip{display:flex;align-items:center;gap:6px;background:var(--purple-bg);color:var(--purple);font-size:12px;padding:5px 12px;border-radius:99px;font-weight:500}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
#view{padding:24px 26px 60px;max-width:1280px;width:100%}
/* ---------- 通用组件 ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px 22px}
.card h3{font-size:14.5px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit}
.btn-p{background:var(--primary);color:#fff}
.btn-p:hover{background:var(--primary-d)}
.btn-o{background:#fff;color:var(--text);border:1px solid var(--border)}
.btn-o:hover{border-color:var(--primary);color:var(--primary)}
.btn-g{background:var(--green);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:4.5px 11px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ai{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff}
.btn-ai:hover{filter:brightness(1.08)}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;font-weight:500}
.channel-options{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.channel-check{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--border);border-radius:999px;background:#fff;color:var(--muted);font-size:12px;cursor:pointer;transition:.15s;user-select:none}
.channel-check:hover{border-color:#86efac;color:var(--green);background:var(--green-bg)}
.channel-check.selected{border-color:#bbf7d0;background:var(--green-bg);color:var(--green);font-weight:500}
.channel-check input{width:14px;height:14px;margin:0;accent-color:var(--green);cursor:pointer}
.jd-editor{display:block;width:100%;min-height:260px;resize:vertical;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:16px;font:inherit;font-size:12.5px;line-height:1.8;color:var(--text);outline:none}
.jd-editor:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg);background:#fff}
.t-blue{background:var(--primary-bg);color:var(--primary)}
.t-green{background:var(--green-bg);color:var(--green)}
.t-orange{background:var(--orange-bg);color:var(--orange)}
.t-red{background:var(--red-bg);color:var(--red)}
.t-purple{background:var(--purple-bg);color:var(--purple)}
.t-gold{background:var(--gold-bg);color:var(--gold)}
.t-gray{background:#f1f5f9;color:var(--muted)}
.t-teal{background:var(--teal-bg);color:var(--teal)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#f8fafc;text-align:left;padding:10px 12px;font-weight:600;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.tbl tr:hover td{background:#f8fbff}
.tbl .num{font-weight:700;font-size:15px}
.score-hi{color:var(--green)}.score-mid{color:var(--gold)}.score-lo{color:var(--red)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .e-icon{font-size:40px;margin-bottom:12px;opacity:.5}
/* 步骤条 */
.steps{display:flex;gap:0;margin:4px 0 20px;flex-wrap:wrap}
.step{flex:1;min-width:100px;text-align:center;position:relative;padding-top:26px;font-size:12px;color:var(--muted)}
.step::before{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:#e2e8f0;color:#64748b;font-size:11px;line-height:22px;font-weight:600}
.step.done::before{background:var(--green);color:#fff}
.step.cur::before{background:var(--primary);color:#fff;box-shadow:0 0 0 4px var(--primary-bg)}
.step.cur{color:var(--primary);font-weight:600}
.step::after{content:"";position:absolute;top:10.5px;left:calc(50% + 14px);right:calc(-50% + 14px);height:2px;background:#e2e8f0}
.step:last-child::after{display:none}
.step.done::after{background:var(--green)}
/* 统计卡 */
.stat{padding:18px 20px;position:relative;overflow:hidden}
.stat .s-label{font-size:12px;color:var(--muted)}
.stat .s-val{font-size:26px;font-weight:700;margin-top:6px}
.stat .s-foot{font-size:11.5px;color:var(--muted);margin-top:8px}
.stat .s-icon{position:absolute;right:14px;top:14px;font-size:20px;opacity:.85}
/* 对话框 */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:480px}
.chat-log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:76%;padding:11px 15px;border-radius:12px;line-height:1.65;font-size:13.5px;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:3px}
.msg.bot{align-self:flex-start;background:#f8fafc;border:1px solid var(--border);border-bottom-left-radius:3px}
.msg.bot b{color:var(--primary)}
.chat-chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 12px}
.chip{background:var(--primary-bg);color:var(--primary);font-size:12px;padding:6px 13px;border-radius:99px;cursor:pointer;border:1px solid #dbeafe}
.chip:hover{background:var(--primary);color:#fff}
.chat-input{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--border)}
.chat-input input{flex:1;border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:13.5px;font-family:inherit;outline:none}
.chat-input input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
/* 面试题表 */
.if-tabs{display:flex;gap:8px;margin-bottom:16px}
.if-tab{padding:8px 18px;border-radius:9px;cursor:pointer;font-size:13.5px;background:#f1f5f9;color:var(--muted);font-weight:500}
.if-tab.active{background:var(--card);color:var(--text);box-shadow:var(--shadow);border:1px solid var(--border)}
.if-tab.active span{color:var(--primary)}
.q-item{border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden}
.q-head{display:flex;align-items:flex-start;gap:10px;padding:13px 15px;background:#f8fafc}
.q-no{width:22px;height:22px;border-radius:6px;background:var(--primary);color:#fff;font-size:11.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:600;margin-top:1px}
.q-txt{font-weight:600;font-size:13.5px;line-height:1.5;flex:1}
.q-dim{font-size:11px;color:var(--muted);margin-top:3px}
.q-levels{display:grid;grid-template-columns:1fr 1fr 1fr 110px;gap:0;border-top:1px solid var(--border)}
.lv{padding:10px 13px;font-size:12px;line-height:1.6;border-right:1px solid #f1f5f9;cursor:pointer;transition:.12s}
.lv:hover{background:#f8fbff}
.lv.sel-g{background:var(--green-bg);box-shadow:inset 0 0 0 1.5px var(--green)}
.lv.sel-m{background:var(--gold-bg);box-shadow:inset 0 0 0 1.5px var(--gold)}
.lv.sel-p{background:var(--red-bg);box-shadow:inset 0 0 0 1.5px var(--red)}
.lv b{display:block;font-size:11px;margin-bottom:3px}
.lv .lg{color:var(--green)}.lv .lm{color:var(--gold)}.lv .lp{color:var(--red)}
.lv-act{display:flex;align-items:center;justify-content:center;gap:6px}
.score-pill{background:var(--primary-bg);color:var(--primary);font-weight:700;border-radius:8px;padding:5px 0;width:100%;text-align:center;font-size:14px}
/* 雷达/条形 */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12px}
.bar-label{width:64px;text-align:right;color:var(--muted);flex-shrink:0}
.bar-track{flex:1;height:9px;background:#f1f5f9;border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#3b82f6,#7c3aed);transition:width .5s}
.bar-val{width:34px;font-weight:600}
/* modal */
#modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;display:none;align-items:center;justify-content:center}
#modal-mask.show{display:flex}
#modal{background:#fff;border-radius:16px;width:min(680px,92vw);max-height:86vh;overflow-y:auto;box-shadow:0 24px 60px rgba(15,23,42,.25)}
#modal .m-head{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;font-size:15.5px;font-weight:600;position:sticky;top:0;background:#fff;z-index:2}
#modal .m-close{margin-left:auto;cursor:pointer;color:var(--muted);font-size:19px;line-height:1;background:none;border:none}
#modal .m-body{padding:22px 24px}
/* toast */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:#0f172a;color:#fff;padding:11px 22px;border-radius:10px;font-size:13.5px;z-index:200;transition:.3s;box-shadow:0 10px 30px rgba(15,23,42,.3);display:flex;gap:8px;align-items:center;max-width:80vw}
#toast.show{transform:translateX(-50%) translateY(0)}
/* 流程线 */
.flow-line{display:flex;align-items:center;gap:0;overflow-x:auto;padding:8px 0}
.fl-node{flex-shrink:0;padding:9px 15px;border-radius:9px;background:#f8fafc;border:1px solid var(--border);font-size:12.5px;position:relative}
.fl-node.ok{background:var(--green-bg);border-color:#bbf7d0;color:var(--green)}
.fl-node.cur{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}
.fl-arrow{flex-shrink:0;padding:0 7px;color:#cbd5e1;font-size:15px}
.resume-detail p{margin:4px 0;font-size:13px;line-height:1.7}
.resume-detail .rd-sec{margin-bottom:14px}
.resume-detail .rd-sec h4{font-size:12.5px;color:var(--primary);margin-bottom:5px;border-left:3px solid var(--primary);padding-left:8px}
.dim-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.dim-cell{background:#f8fafc;border-radius:9px;padding:10px;text-align:center}
.dim-cell .d-v{font-size:19px;font-weight:700}
.dim-cell .d-l{font-size:11px;color:var(--muted);margin-top:3px}
.waiting{opacity:.55}
.clickable{cursor:pointer;transition:background .15s,transform .15s,box-shadow .15s}
.clickable:hover{background:#f8fbff!important}
.card.clickable:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(37,99,235,.10)}
.link-title{color:var(--primary);cursor:pointer;text-decoration:none;font-weight:600}
.link-title:hover{text-decoration:underline;color:var(--primary-d)}
.detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}
.detail-hero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--primary-bg),var(--purple-bg));border-radius:12px;padding:16px;margin-bottom:16px}
.detail-kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.detail-kv>div{background:#f8fafc;border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:12.5px}
.detail-kv small{display:block;color:var(--muted);margin-bottom:4px}
.route-tip{position:fixed;right:22px;bottom:22px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:11px 14px;box-shadow:0 10px 30px rgba(15,23,42,.16);z-index:90;font-size:12.5px;display:none;align-items:center;gap:10px}
.route-tip.show{display:flex;animation:tipIn .2s ease-out}
.route-tip .spinner{width:16px;height:16px;border:2px solid #dbeafe;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tipIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--border);border-radius:8px;padding:8.5px 12px;font-size:13px;font-family:inherit;outline:none;background:#fff}
input.f:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
label.fl{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
.score-input{width:150px!important;max-width:150px;height:44px;padding:6px 10px!important;font-size:22px!important;font-weight:700;text-align:center}
.form-row{margin-bottom:14px}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.ring{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.rank-1{background:var(--gold-bg);color:var(--gold)}
.rank-2{background:#f1f5f9;color:#64748b}
.rank-3{background:var(--orange-bg);color:var(--orange)}
@media(max-width:960px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr!important}#sidebar{display:none}#main{margin-left:0}.detail-kv{grid-template-columns:1fr}#view{padding:18px 14px 50px}#topbar{padding:0 14px}.ai-chip{display:none}}
</style>
</head>

}
async function bootstrapServerState(){
  if(!API_BASE)return;
  try{
    const response=await fetch(API_BASE+'/api/state');
    if(response.ok){
      const remote=await response.json();
      if(remote&&remote.jobs){state=normalizeState(remote);localStorage.setItem(STORE_KEY,JSON.stringify(state));renderNav();render();}
    }else if(response.status===404){
      await fetch(API_BASE+'/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});
    }
    serverSyncReady=true;
  }catch(e){
    serverSyncReady=false;
  }
}

function writeRoute(v,opts={},replace=false){const q=new URLSearchParams();if(opts.job)q.set('job',opts.job);if(opts.detail)q.set('detail',opts.detail);const next='#/'+v+(q.toString()?'?'+q.toString():'');if(location.hash===next)return;(replace?history.replaceState:history.pushState).call(history,null,'',next);}
function go(v,opts={}){const vi=VIEWS.find(x=>x.id===v)||VIEWS[0];curView=vi.id;if(opts.job&&job(opts.job))curJob=opts.job;

function chatPush(t,r){state.chatLog.push({t,r});save();}
function quickAsk(q){document.getElementById('chat-in').value=q;ask();}
function ask(){
 const inp=document.getElementById('chat-in');const q=inp.value.trim();if(!q)return;inp.value='';
 chatPush(q,false);render();scrollChat();
 setTimeout(()=>{chatPush(parseChat(q),true);render();scrollChat();},420);
}
function scrollChat(){setTimeout(()=>{const el=document.getElementById('chat-log');if(el)el.scrollTop=el.scrollHeight;},60);}
function parseChat(q){
 const cs=state.cands.filter(c=>candidateHasJob(c,curJob));const orig=cs.length;let pool=cs.slice();const notes=[];
 const ym=q.match(/(\d+)\s*年(以上)?/);if(ym){const y=+ym[1];pool=pool.filter(c=>c.years>=y);notes.push(`经验 ≥ ${y}年`);}
 if(/硕士|研究生/.test(q)){pool=pool.filter(c=>c.edu==='硕士');notes.push('学历 = 硕士');}
 if(/本科以上|本科及以上/.test(q)){pool=pool.filter(c=>c.edu==='本科'||c.edu==='硕士');notes.push('学历 ≥ 本科');}
 if(/大专|排除大专/.test(q)&&!/大专以上/.test(q)){pool=pool.filter(c=>c.edu!=='大专');notes.push('排除大专');}
 if(/稳定/.test(q)){const m=q.match(/(\d+)\s*年/);const y=m?+m[1]:2;pool=pool.filter(c=>c.stability>=y);notes.push(`单段稳定性 ≥ ${y}年`);}
 if(/80分|八十分/.test(q)){pool=pool.filter(c=>c.score>=80);notes.push('综合评分 ≥ 80');}
 if(/管理|带过团队|leader/i.test(q)){pool=pool.filter(c=>/管理|带|专家|总监/.test(c.lastTitle+c.exp));notes.push('有团队管理/主导经验');}
 if(/高并发|性能/.test(q)){pool=pool.filter(c=>c.skills.some(s=>/高并发|性能|调优/.test(s))||/高并发|性能/.test(c.exp));notes.push('具备高并发/性能优化经验');}
 if(/排除|不要|剔除/.test(q)&&/稳定不足|不足/.test(q)){pool=pool.filter(c=>c.stability>=2);notes.push('排除稳定性不足2年');}
 if(!notes.length)return '抱歉，我暂时没有理解这个条件 🤔\n您可以试试：\n· "5年以上经验的候选人"\n· "硕士学历"\n· "稳定性2年以上"\n· "有团队管理经验的"';
 pool.sort((a,b)=>b.score-a.score);
 let r=`已按条件执行筛选：\n${notes.map(n=>'· '+n).join('\n')}\n\n匹配 <b>${pool.length} / ${orig}</b> 位候选人`;
 if(pool.length){r+='\n\n'+pool.slice(0,6).map((c,i)=>`${i+1}. <a class="link-title" onclick="showCand('${c.id}')">${c.name}</a> · ${c.edu} · ${c.years}年 · ${c.company} · <b>${c.score}分</b>${c.status==='rejected'?'（已淘汰）':''}`).join('\n');
  const top=pool.filter(c=>c.status!=='rejected');
  if(top.length)r+=`\n\n点击顶部「简历库」查看完整评分明细。是否需要我把结果同步到简历库标记？`;}
 return r;
}

 ${of?`<div class="flow-line">${of.chain.map((s,i)=>`<span class="fl-node ${s[1]?'ok':!of.chain.slice(0,i).some(x=>!x[1])?'cur':''}">${s[0]} ${s[1]?'✓':'⏳'}</span>${i<of.chain.length-1?'<span class="fl-arrow">→</span>':''}`).join('')}</div>`:'<div class="hint">综合评分达到录用阈值，可发起定薪审批。</div>'}
 <div class="letter" style="margin-top:16px"><h2 style="text-align:center;margin-bottom:18px">录用通知书</h2><p>${c.name} 先生/女士：</p><p>您好！经过综合评估，我们诚邀您加入龙道数据集团，担任 <b>${(job(c.jobId)||{}).title||''}</b>。</p><p><b>建议薪资：</b>${of?of.salary:c.expect}　　<b>预计入职：</b>2026-09-15</p><p>正式 Offer 将通过邮件、钉钉及短信发送，候选人确认后自动触发入职材料与试用期跟进流程。</p></div>
 <div class="detail-actions">${!of?`<button class="btn btn-p" onclick="startOffer('${id}');showOfferDetail('${id}')">发起定薪审批</button>`:!of.done?`<button class="btn btn-p" onclick="approveNext('${id}');showOfferDetail('${id}')">审批下一步</button>`:!of.sent?`<button class="btn btn-ai" onclick="sendOffer('${id}')">一键发送 Offer</button>`:!of.accepted?`<button class="btn btn-g" onclick="acceptOffer('${id}')">模拟候选人接受</button>`:('<span class="tag t-green" style="padding:8px 14px">✓ 已触发入职流程</span> <button class="btn btn-o btn-sm" onclick="showOnboarding(\''+id+'\')">查看入职任务</button>')}<button class="btn btn-o" onclick="window.print()">打印 / 保存 PDF</button></div>`);}

function showChannelDetail(index){const names=['BOSS直聘','猎聘','前程无忧','公司官网'];const name=names[Number(index)]||index;const cs=channelCandidates(name);openModal('渠道详情 · '+name,`<div class="detail-hero"><div class="logo-icon">${name.slice(0,1)}</div><div><b style="font-size:17px">${name}</b><div class="hint">API 已连接 · 简历实时回流 · 自动去重评分</div></div><span class="tag t-green" style="margin-left:auto">运行正常</span></div><div class="detail-kv"><div><small>回流简历</small><b>${cs.length} 份</b></div><div><small>平均评分</small><b>${cs.length?Math.round(cs.reduce((s,c)=>s+c.score,0)/cs.length):'—'}</b></div><div><small>高分简历</small><b>${cs.filter(c=>c.score>=80).length} 份</b></div><div><small>发布岗位</small><b>${state.jobs.filter(j=>j.published).length} 个</b></div></div><div class="rd-sec"><h4>回流候选人</h4>${cs.length?cs.map(c=>`<p><a class="link-title" onclick="closeModal();showCand('${c.id}')">${c.name}</a> · ${c.score}分 · ${c.company}</p>`).join(''):'<p class="hint">暂无候选人回流。</p>'}</div><div class="detail-actions"><button class="btn btn-p" onclick="closeModal();go('resume')">查看简历库</button><button class="btn btn-o" onclick="closeModal();go('board')">查看渠道对比</button></div>`);writeRoute(curView,{job:curJob,detail:'channel:'+index},true);}

function showFunnelDetail(index){const views=['resume','resume','resume','interview','offer'];const labels=['全部入库简历','AI 评分达标候选人','复筛通过候选人','进入面试候选人','已发送 Offer 候选人'];const filters=[c=>true,c=>c.score>=80,c=>!['pending','rejected'].includes(c.status),c=>['interview','offer','hired'].includes(c.status),c=>state.offers[c.id]&&state.offers[c.id].sent];const list=state.cands.filter(filters[Number(index)]||filters[0]);openModal('招聘漏斗详情 · '+(labels[index]||labels[0]),`<div class="hint" style="margin-bottom:12px">共 ${list.length} 人，点击姓名可继续查看候选人完整档案。</div>${list.length?`<table class="tbl"><tr><th>候选人</th><th>岗位</th><th>评分</th><th>状态</th></tr>${list.map(c=>`<tr class="clickable" onclick="showCand('${c.id}')"><td><a class="link-title">${c.name}</a></td><td>${(job(c.jobId)||{}).title||''}</td><td class="num ${sc(c.score)}">${c.score}</td><td>${statusTag(c.status)}</td></tr>`).join('')}</table>`:'<div class="empty">暂无数据</div>'}<div class="detail-actions"><button class="btn btn-p" onclick="closeModal();go('${views[index]||'resume'}')">进入对应环节</button></div>`);writeRoute(curView,{job:curJob,detail:'funnel:'+index},true);}

function vTalent(){
 const q=(window.talentQuery||'').trim().toLowerCase(); const pool=state.cands.filter(c=>(c.status==='rejected'||c.status==='pending'||c.talentStatus==='active')&&(!q||[c.name,c.company,c.lastTitle,(c.skills||[]).join(' '),(c.tags||[]).join(' ')].join(' ').toLowerCase().includes(q)));
 return '<div class="card card-pad"><h3>👥 人才库 <span class="tag t-blue">'+pool.length+' 人</span><span style="float:right"><button class="btn btn-p btn-sm" onclick="openTalentSearch()">搜索 / 标签</button></span></h3><div class="talent-filters"><input class="f" id="talent-search" placeholder="搜索姓名、公司、技能、岗位" value="'+escHtml(window.talentQuery||'')+'"><button class="btn btn-o btn-sm" onclick="window.talentQuery=document.getElementById(\'talent-search\').value;render()">搜索</button></div><table class="tbl"><tr><th>候选人</th><th>投递岗位</th><th>评分</th><th>来源</th><th>标签</th><th>状态</th><th>操作</th></tr>'+pool.map(c=>'<tr class="clickable" onclick="showCand(\''+c.id+'\')"><td><a class="link-title">'+escHtml(c.name)+'</a></td><td>'+(c.jobIds||[c.jobId]).map(id=>(job(id)||{}).title||id).join('、')+'</td><td class="num '+sc(c.score)+'">'+c.score+'</td><td>'+escHtml(c.source)+'</td><td>'+(c.tags||[]).map(t=>'<span class="tag t-blue">'+escHtml(t)+'</span>').join(' ')+'</td><td>'+statusTag(c.status)+(c.talentStatus==='active'?'<span class="tag t-teal">已激活</span>':'')+'</td><td><button class="btn btn-o btn-sm" onclick="event.stopPropagation();editTalentTags(\''+c.id+'\')">标签</button> <button class="btn btn-g btn-sm" onclick="event.stopPropagation();activateTalent(\''+c.id+'\')">激活</button></td></tr>').join('')+'</table><div class="hint" style="margin-top:12px">支持按姓名、公司、技能和岗位搜索，优质候选人可打标签并重新激活。</div></div>';
}
function openTalentSearch(){openModal('🔎 人才库搜索', '<div class="form-row"><label class="fl">关键词</label><input class="f" id="talent-search-modal" value="'+escHtml(window.talentQuery||'')+'"></div><div class="detail-actions"><button class="btn btn-o" onclick="closeModal()">取消</button><button class="btn btn-p" onclick="window.talentQuery=document.getElementById(\'talent-search-modal\').value;closeModal();render()">搜索</button></div>');}
function editTalentTags(id){const c=cand(id);if(!c)return;openModal('🏷️ 编辑候选人标签', '<div class="form-row"><label class="fl">'+escHtml(c.name)+' 的标签（逗号分隔）</label><input class="f" id="talent-tags-edit" value="'+escHtml((c.tags||[]).join('、'))+'"></div><div class="detail-actions"><button class="btn btn-o" onclick="closeModal()">取消</button><button class="btn btn-p" onclick="saveTalentTags(\''+id+'\')">保存标签</button></div>');}
function saveTalentTags(id){const c=cand(id);if(!c)return;c.tags=(document.getElementById('talent-tags-edit')?.value||'').split(/[、,，]/).map(x=>x.trim()).filter(Boolean);state.talentTags[id]=c.tags;save();closeModal();render();}
function activateTalent(id){const c=cand(id);if(!c)return;c.talentStatus='active';c.status='pending';save();toast(c.name+' 已加入激活计划');render();}

function vBoard(){
 const cs=state.cands;
 const funnel=[['简历入库',cs.length],['AI评分达标',cs.filter(c=>c.score>=80).length],['复筛通过',cs.filter(c=>c.status!=='pending'&&c.status!=='rejected').length],['进入面试',cs.filter(c=>c.status==='interview'||c.status==='offer'||c.status==='hired').length],['收到Offer',Object.values(state.offers).filter(o=>o.sent).length]];
 const max=funnel[0][1]||1; const channelRows=['BOSS直聘','猎聘','前程无忧','公司官网'].map(name=>{const cs=state.cands.filter(c=>c.source===name||(name==='公司官网'&&c.source==='官网投递'));return [name,cs.length,cs.length?Math.round(cs.reduce((sum,c)=>sum+c.score,0)/cs.length):0];});
 return `<div class="grid g4" style="margin-bottom:18px">
 ${[['⏱️','平均招聘周期','23','天（进行中）'],['💰','人均招聘成本','¥3,200','渠道+人力'],['📈','简历转化率',Math.round(funnel[2][1]/(funnel[0][1]||1)*100)+'%','复筛通过/入库'],['🏢','渠道效果','BOSS直聘','简历量第一']]
 .map(s=>`<div class="card stat"><div class="s-icon">${s[0]}</div><div class="s-label">${s[1]}</div><div class="s-val" style="font-size:20px">${s[2]}</div><div class="s-foot">${s[3]}</div></div>`).join('')}</div>
 <div class="grid g2">
 <div class="card card-pad"><h3>🔻 招聘漏斗 · 高级Java后端工程师</h3>
 ${funnel.map((f,i)=>`<div class="bar-row clickable" onclick="showFunnelDetail('${i}')"><span class="bar-label" style="width:82px">${f[0]}</span><div class="bar-track" style="height:16px;border-radius:6px"><div class="bar-fill" style="width:${f[1]/max*100}%"></div></div><span class="bar-val" style="width:26px">${f[1]}</span></div>`).join('')}
 <div class="hint" style="margin-top:10px">从简历到 Offer 的全链路转化一目了然，支持按岗位/渠道/时间下钻。</div></div>
 <div class="card card-pad"><h3>📡 渠道效果对比</h3>
 ${channelRows.map((ch,i)=>`<div class="bar-row clickable" onclick="showChannelDetail('${i}')"><span class="bar-label">${ch[0]}</span><div class="bar-track"><div class="bar-fill" style="width:${ch[1]/5*100}%"></div></div><span class="bar-val">${ch[1]}份</span><span class="tag t-blue" style="margin-left:6px">均分${ch[2]}</span></div>`).join('')}
 <div class="hint" style="margin-top:10px">按简历量、平均评分、转化率评估渠道 ROI，指导投放预算分配。</div></div>
 </div>`;
}

/* ================== 启动 ================== */
if(location.hash)applyRoute();else go('dash',{replace:true,instant:true});
bootstrapServerState();
</script>
</body>
</html>
