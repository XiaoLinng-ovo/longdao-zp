name: smartrecruit-production

x-backend: &backend
  image: smartrecruit-backend:local
  build:
    context: .
    target: backend
  env_file:
    - ${SMARTRECRUIT_RUNTIME_ENV:-./deploy/runtime.production.env}
  volumes:
    - objects:/var/lib/smartrecruit/objects
  init: true
  restart: unless-stopped
  stop_grace_period: 35s

x-backend-environment: &backend-environment
  NODE_ENV: production
  SMARTRECRUIT_MANAGED_ENV: '1'
  TENANT_SCHEMA_ROUTING: 'on'
  WORKER_DB_POLL: 'true'
  RECRUITING_QUARANTINE_ROOT: /var/lib/smartrecruit/objects
  INTERVIEW_STORAGE_ROOT: /var/lib/smartrecruit/objects

services:
  postgres:
    profiles: [local-db]
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${PGDATABASE:-smartrecruit}
      POSTGRES_USER: ${PGUSER:-smartrecruit}
      POSTGRES_PASSWORD: ${PGPASSWORD:-}
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 4s
      retries: 20

  api:
    <<: *backend
    environment:
      <<: *backend-environment
      HOST: 0.0.0.0
      PORT: '3100'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3100/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *backend
    command: [node, --import, ./scripts/container-backend.mjs, apps/worker/dist/src/index.js]
    environment:
      <<: *backend-environment
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: '4001'
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      target: web
    ports:
      - '127.0.0.1:${WEB_PORT:-5174}:5174'
    depends_on:
      api: {condition: service_healthy}
    init: true
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5174/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  ocr:
    profiles: [ocr]
    build: ./ocr-service
    volumes:
      - paddle:/root/.paddlex
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      start_period: 180s
      retries: 15

  funasr:
    profiles: [funasr]
    build: ./funasr-service
    environment:
      FUNASR_DEVICE: cpu
    volumes:
      - funasr:/models
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10095/ready', timeout=5)"]
      interval: 20s
      timeout: 8s
      start_period: 180s
      retries: 15

  faster-whisper:
    profiles: [whisper]
    build: ./faster-whisper-service
    environment:
      FASTER_WHISPER_TOKEN: ${FASTER_WHISPER_TOKEN:-}
    volumes:
      - whisper:/models
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; token=os.getenv('FASTER_WHISPER_TOKEN'); req=urllib.request.Request('http://127.0.0.1:10096/health', headers={'Authorization':'Bearer '+token} if token else {}); urllib.request.urlopen(req, timeout=5)"]
      interval: 20s
      timeout: 8s
      start_period: 180s
      retries: 15

volumes:
  postgres:
  objects:
  paddle:
  funasr:
  whisper:
